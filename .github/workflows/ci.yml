name: CI Offline Test Suite & Eval Replay

on:
  push:
    branches: [ "main", "portfolio-upgrade" ]
  pull_request:
    branches: [ "main", "portfolio-upgrade" ]

jobs:
  offline-tests:
    name: Run Offline Unit Tests & Evaluation Replay
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Offline Pytest Suite
        run: |
          pytest backend/tests/ -v -rs
        env:
          PYTHONPATH: backend
          AUTH_SECRET_KEY: test_only_ci_secret_key_for_hs256_2026

      - name: Run 40-Case Evaluation Offline Replay
        run: |
          python backend/eval/eval_suite.py --replay
        env:
          PYTHONPATH: backend
          AUTH_SECRET_KEY: test_only_ci_secret_key_for_hs256_2026

      - name: Run 20-Case Held-Out Evaluation Offline Replay
        run: |
          python backend/eval/eval_suite.py --held-out-replay
        env:
          PYTHONPATH: backend
          AUTH_SECRET_KEY: test_only_ci_secret_key_for_hs256_2026
